<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#020706">
  <title>404 // Frequency Lost</title>
  <link rel="icon" href="assets/img/brand/favicon.ico" sizes="any">
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020706;color:#d9eee9;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background-image:linear-gradient(rgba(77,168,162,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(77,168,162,.06) 1px,transparent 1px);background-size:42px 42px}.box{width:min(720px,calc(100% - 28px));padding:2rem;border:2px solid #5ca39c;background:rgba(1,9,7,.94);box-shadow:0 0 30px rgba(92,163,156,.15);text-align:center;position:relative}.box:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 4px)}img{width:min(170px,40%);filter:drop-shadow(0 0 12px rgba(159,247,238,.24))}h1{font-size:clamp(2.5rem,8vw,5rem);margin:.6rem 0 .1rem;color:#9ff7ee}p{color:#78aaa4}.freq{font-size:1.1rem;letter-spacing:.14rem;color:#9ff7ee}a{display:inline-block;margin-top:1rem;padding:.65rem 1rem;border:1px solid #5ca39c;color:#9ff7ee;text-decoration:none}a:hover{background:#9ff7ee;color:#020706}
  </style>
</head>
<body>
  <main class="box">
    <img src="assets/img/brand/dg-secondary-teal.png" alt="DG logo">
    <div class="freq">ERROR // 404.00</div>
    <h1>FREQUENCY LOST</h1>
    <p>The requested file is outside the current communications channel.</p>
    <a href="./">RETURN TO CODEC</a>
  </main>
</body>
</html>
